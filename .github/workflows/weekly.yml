# Daily check, refresh only when needed.
#   Job 1 (check):   every day, ~1 minute. Asks TMDB: any new movies this year?
#   Job 2 (refresh): the full pipeline. Runs ONLY if job 1 found something new,
#                    or if you start it by hand with "force" ticked.
name: daily-check-and-refresh

on:
  schedule:
    - cron: "17 9 * * *"      # every day, 09:17 UTC = 03:17 Guatemala
  workflow_dispatch:           # "Run workflow" button
    inputs:
      force:
        description: "Run the full refresh even if nothing is new"
        type: boolean
        default: false

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}

jobs:
  # ---------- Job 1: cheap daily check ----------
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_new: ${{ steps.check.outputs.has_new }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only what the check needs
        run: pip install requests python-dotenv huggingface_hub
      - name: Any new movies?
        id: check
        run: python -m scripts.check_new_movies

  # ---------- Job 2: full refresh, only if needed ----------
  refresh:
    needs: check
    if: needs.check.outputs.has_new == 'true' || inputs.force
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages (CPU-only torch keeps it small)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Only fetch the current year
        run: |
          echo "START_YEAR=$(date +%Y)" >> $GITHUB_ENV
          echo "END_YEAR=$(date +%Y)"   >> $GITHUB_ENV

      - name: Download current data
        run: python scripts/hf_sync.py download

      - name: Extract
        run: |
          python -m extract.fetch_discover
          python -m extract.fetch_details
          python -m extract.fetch_wiki_plots

      - name: Load
        run: python -m load.load_raw

      - name: Transform (dbt)
        working-directory: transform
        run: dbt build --profiles-dir .

      - name: Embed new movies
        run: python -m search.embed

      - name: Publish data
        run: python scripts/hf_sync.py upload
